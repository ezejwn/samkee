[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# "Deploy to Netlify" 버튼으로 새 사이트를 만들 때 입력칸으로 표시됩니다 (나중에 Site configuration에서도 변경 가능)
[template.environment]
  KIS_APPKEY = "한국투자증권 Open API 앱키 (실시간 시세)"
  KIS_APPSECRET = "한국투자증권 Open API 시크릿"
  NAVER_CLIENT_ID = "네이버 검색 API Client ID (실시간 뉴스, 선택)"
  NAVER_CLIENT_SECRET = "네이버 검색 API Client Secret (선택)"
  NOTE_ADMIN_TOKEN = "사이트에서 기록 추가용 비밀 문자열 (선택)"
